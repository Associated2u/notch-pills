# 10-guard.conf -- mrog-notch runaway containment.
# Installed 2026-09-07 by session HERMES-VGE, after the notch consumed
# 11h48m30s of CPU in 12h01m of wall clock and froze the laptop.
#
# TWO INDEPENDENT LAYERS, on purpose. The root cause is not yet identified, so
# neither layer is allowed to be the only thing standing between a spin and a
# frozen desktop.
#
#   1. CPUQuota -- the KERNEL fence. Needs no script to be correct and no cause
#      to be known. A healthy notch measured 0.5-2.7% of one core over 42- and
#      52-minute runs, so 50% is ~20x headroom over normal and still caps a
#      runaway at half a core. It cannot regress; systemd enforces it.
#
#   2. ExecStart -> mrog-notch-guard -- the DETECTOR. Kills and restarts a
#      confirmed runaway within ~15 s instead of 12 hours, and captures the
#      Python stack that names the loop. Verified on three fixtures 2026-09-07:
#      a real runaway (caught, exact hot line), a healthy process (no false
#      positive), and a missing profiler (fails loud, never a silent pass).
#
# TO ROLL BACK: rm this file, `systemctl --user daemon-reload`, restart.
# The unit itself was NOT edited -- its ExecStart is overridden here, which is
# why the empty ExecStart= line below is required (systemd appends otherwise).

[Service]
CPUQuota=50%
MemoryMax=500M

ExecStart=
ExecStart=%h/mrog/bin/mrog-notch-guard
